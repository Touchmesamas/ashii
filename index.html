
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Monthsary, Baby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #24102f;
    --night-2: #3a1a48;
    --paper: #f8e3e6;
    --paper-edge: #eebfca;
    --rose: #f4a6b8;
    --wax: #b3203f;
    --ink: #4a2433;
    --script: 'Parisienne', 'Brush Script MT', cursive;
    --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 20%, #ff9fbd, #c2185b 85%);
    color: var(--paper);
    font-family: var(--serif);
    overflow-x: hidden;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .screen { min-height: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 28px 20px; text-align: center; }
  .screen.active { display: flex; animation: screenIn .9s cubic-bezier(.22, 1, .36, 1) both; }
  .screen.leaving { animation: screenOut .5s ease forwards; }
  @keyframes screenIn { from { opacity: 0; transform: scale(.97); filter: blur(6px); } to { opacity: 1; transform: none; filter: blur(0); } }
  @keyframes screenOut { to { opacity: 0; transform: scale(1.03); filter: blur(8px); } }

  /* floating hearts, the one ambient moment */
  #hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .float-heart { position: absolute; bottom: -40px; color: var(--rose); opacity: 0; animation: rise linear forwards; }
  @keyframes rise { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: .5; } 100% { transform: translateY(-110vh) scale(1.1); opacity: 0; } }

  .screen, .modal { position: relative; z-index: 1; }

  /* intro */
  .intro h1 {
  font-family: var(--script);
  font-weight: 400;
  font-size: clamp(54px, 17vw, 96px);
  line-height: 1.05;
  color: var(--rose);
  text-shadow:
    2px 2px 0 rgba(36, 16, 47, 0.55),
    0 4px 12px rgba(36, 16, 47, 0.35);
}
  .intro p { font-size: 21px; font-style: italic; margin: 18px 0 40px; color: var(--paper); opacity: .85; }
  .seal-btn { width: 96px; height: 96px; border-radius: 50%; border: none; cursor: pointer; background: radial-gradient(circle at 35% 30%, #d9405f, var(--wax) 60%, #7d1229); box-shadow: 0 6px 22px rgba(0,0,0,.45), inset 0 -4px 8px rgba(0,0,0,.25); display: grid; place-items: center; animation: beat 1.6s ease-in-out infinite; }
  .seal-btn svg { width: 42px; height: 42px; fill: #ffd9e0; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.09); } }
  .hint { margin-top: 18px; font-size: 17px; opacity: .7; font-style: italic; }
  .intro h1 .w { display: inline-block; animation: wordIn 1.3s cubic-bezier(.22, 1, .36, 1) both; animation-delay: calc(var(--i) * .25s + .3s); }
  @keyframes wordIn { from { opacity: 0; transform: translateY(28px); filter: blur(10px); } to { opacity: 1; transform: none; filter: blur(0); } }
  .intro.active p { animation: softIn 1.2s 1.3s both; }
  .intro.active .seal-btn { animation: softIn 1.2s 1.9s both, beat 1.8s 3.1s ease-in-out infinite; }
  .intro.active .hint { animation: softIn 1.2s 2.4s both; }
  @keyframes softIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .pick.active h2 { animation: softIn 1s .2s both; }
  .pick.active .sub { animation: softIn 1s .4s both; }
  .pick.active .env { animation: envIn 1s cubic-bezier(.22, 1, .36, 1) both; animation-delay: calc(.55s + var(--i) * .14s); }
  @keyframes envIn { from { opacity: 0; transform: translateY(40px) rotate(calc(var(--i) * 2deg - 4deg)) scale(.9); } to { opacity: 1; transform: none; } }

  /* envelopes */
  .pick h2 {
  font-family: var(--script);
  font-weight: 400;
  font-size: 44px;
  color: var(--rose);
  margin-bottom: 6px;
  text-shadow:
    2px 2px 0 rgba(36, 16, 47, 0.55),
    0 4px 10px rgba(36, 16, 47, 0.35);
}
  .pick .sub { font-style: italic; font-size: 19px; opacity: .8; margin-bottom: 26px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px 16px; width: 100%; max-width: 420px; }
  .grid .env:last-child { grid-column: 1 / -1; width: calc(50% - 8px); justify-self: center; }
  .env { background: none; border: none; cursor: pointer; font-family: var(--serif); color: var(--paper); }
  .env-body { position: relative; aspect-ratio: 3 / 2; background: var(--paper); border-radius: 4px; box-shadow: 0 8px 18px rgba(0,0,0,.4); overflow: hidden; transition: transform .5s cubic-bezier(.22, 1, .36, 1), box-shadow .5s; }
  .env:active .env-body { transform: scale(.96); }
  .env-body::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom right, transparent 49.5%, var(--paper-edge) 50%) left / 50% 100% no-repeat, linear-gradient(to bottom left, transparent 49.5%, var(--paper-edge) 50%) right / 50% 100% no-repeat; }
  .env-body::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 60%; background: #fbd0d9; clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top; transition: transform .7s cubic-bezier(.4, 0, .2, 1); }
  .env .mini-seal { position: absolute; left: 50%; top: 52%; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #d9405f, var(--wax)); z-index: 2; display: grid; place-items: center; box-shadow: 0 2px 5px rgba(0,0,0,.4); }
  .env .mini-seal svg { width: 14px; height: 14px; fill: #ffd9e0; }
  .env.opened .env-body::after { transform: rotateX(180deg); }
  .env .mini-seal { transition: opacity .4s, transform .4s; }
  .env.opened .mini-seal { opacity: .35; }
  .env.lift .env-body { transform: translateY(-10px) scale(1.1); box-shadow: 0 18px 34px rgba(0,0,0,.55); }
  .env.lift .mini-seal { opacity: 0; transform: scale(.5); }
  .env .label { display: block; margin-top: 9px; font-size: 18px; font-style: italic; }
  .finale { margin-top: 28px; font-family: var(--script); font-size: 32px; color: var(--rose); min-height: 44px; opacity: 0; transition: opacity 1s; }
  .finale.show { opacity: 1; }

  /* modal */
  .modal { position: fixed; inset: 0; z-index: 10; background: rgba(20, 8, 28, .92); opacity: 0; visibility: hidden; transition: opacity .6s ease, visibility 0s linear .6s; overflow-y: auto; padding: 26px 18px calc(30px + env(safe-area-inset-bottom)); }
  .modal.open { opacity: 1; visibility: visible; transition: opacity .6s ease, visibility 0s; }
  .modal-inner { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; }
  .close { align-self: flex-end; background: none; border: 1px solid rgba(248, 227, 230, .4); color: var(--paper); font-family: var(--serif); font-size: 18px; padding: 6px 16px; border-radius: 20px; cursor: pointer; margin-bottom: 16px; }

  .polaroid { background: #fff; padding: 12px 12px 42px; border-radius: 3px; box-shadow: 0 12px 30px rgba(0,0,0,.5); transform: rotate(-2.5deg); width: 82%; }
  .modal.open .polaroid { animation: pop 1.1s .1s cubic-bezier(.22, 1.2, .36, 1) both; }
  .modal.open .player { animation: softIn .9s .6s both; }
  .polaroid .ph { width: 100%; aspect-ratio: 4 / 5; background: linear-gradient(135deg, var(--night-2), var(--wax)); display: grid; place-items: center; overflow: hidden; }
  .polaroid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .polaroid .ph span { font-family: var(--script); font-size: 30px; color: var(--paper); padding: 20px; }
  .polaroid .cap { font-family: var(--script); color: var(--ink); font-size: 26px; margin-top: 10px; text-align: center; }
  @keyframes pop { from { transform: translateY(40px) rotate(6deg) scale(.7); opacity: 0; } to { transform: translateY(0) rotate(-2.5deg) scale(1); opacity: 1; } }

  .player { margin: 26px 0 8px; display: flex; align-items: center; gap: 12px; background: rgba(248, 227, 230, .1); border-radius: 30px; padding: 8px 18px 8px 8px; }
  .play { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--rose); color: var(--night); cursor: pointer; display: grid; place-items: center; }
  .play svg { width: 18px; height: 18px; fill: currentColor; }
  .song { font-style: italic; font-size: 18px; text-align: left; }

  .letter { background: var(--paper); color: var(--ink); border-radius: 4px; padding: 28px 24px; margin-top: 18px; width: 100%; text-align: left; box-shadow: 0 10px 24px rgba(0,0,0,.4); }
  .modal.open .letter { animation: fadein 1s .85s both; }
  .letter p { margin-bottom: 14px; }
  .modal.open .letter p, .modal.ope
  .letter img { width: 70%; max-width: 260px; margin: 6px auto 14px; border-radius: 6px; }
  .letter .sig { animation: lineIn 1s cubic-bezier(.22, 1, .36, 1) both; animation-delay: calc(1.3s + var(--i, 0) * .5s); }
  .modal.open .letter .sig { animation-delay: var(--sd, 2.5s); }
  @keyframes lineIn { from { opacity: 0; transform: translateY(12px); filter: blur(3px); } to { opacity: 1; transform: none; filter: blur(0); } }
  .letter p { font-size: 21px; line-height: 1.5; font-style: italic; font-weight: 500; white-space: pre-line; }
  .letter .sig { font-family: var(--script); font-style: normal; font-size: 30px; margin-top: 18px; display: block; text-align: right; }
  @keyframes fadein { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  :focus-visible { outline: 3px solid var(--rose); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="hearts" aria-hidden="true"></div>

<!-- Screen 1: intro -->
<section id="intro" class="screen intro active">
  <h1 id="introTitle">Happy Monthsary, Baby</h1>
  <p id="introLine">I made something for you.</p>
  <button class="seal-btn" id="openBtn" aria-label="Open">
    <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.7-9.6-9.3C.9 8.4 2.7 5 6 5c2 0 3.4 1.1 4.2 2.4h.1C11.1 6.1 12.5 5 14.5 5c3.3 0 5.1 3.4 3.6 6.7C16 16.3 12 21 12 21z" transform="translate(0 -1)"/></svg>
  </button>
  <div class="hint">tap the heart</div>
</section>

<!-- Screen 2: envelopes -->
<section id="pick" class="screen pick">
  <h2>Pick an envelope</h2>
  <div class="sub">Each one is for my babyy ashii</div>
  <div class="grid" id="grid"></div>
  <div class="finale" id="finale"></div>
</section>

<!-- Modal: photo + song + letter -->
<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="modal-inner">
    <button class="close" id="closeBtn">Close</button>
    <div class="polaroid">
      <div class="ph" id="ph"></div>
      <div class="cap" id="cap"></div>
    </div>
    <div class="player">
      <button class="play" id="playBtn" aria-label="Play or pause"></button>
      <div class="song" id="songName"></div>
    </div>
    <div class="letter">
      <div id="letterText"></div>
      <img id="letterGif" alt="" style="display:none">
      <span class="sig" id="sig"></span>
    </div>
  </div>
</div>

<audio id="audio" preload="none"></audio>

<script>
/* ============================================================
   EDIT THIS PART ONLY
   - Put your photos in a folder named "photos"
   - Put your songs in a folder named "music"
   - Change the file names below to match yours
   ============================================================ */
const CONFIG = {
  introTitle: "Happy 7th Monthsary, Ashii Ko",
  introLine: "I made something for you.",
  signature: "Your Marki",      // how you sign each letter
  finale: "That was all five. I love you.",
  envelopes: [
    {
      label: "My Baby Ashii",
      photo: "ashii.jpeg",
      songTitle: "(⁠つ⁠≧⁠▽⁠≦⁠)⁠つ",
      song: "lola.mp3",
      start: 244,
      letter: "Baby,\n\ im glad i got to be your boyfriend im so lucky and thankful man pretty man my baby iloveyou"
    },
    {
      label: "So Lucky",
      photo: "ashii2.jpeg",
      songTitle: "(⁠〃ﾟ⁠3ﾟ⁠〃⁠)",
      song: "daniel.mp3",
      start: 215,
      letter: "Ashii,\n\ I'm so beyond grateful man that you're my gf so kind man pretty and understanding thankyou for your sacrifices for me"
    },
    {
      label: "This Kinda Freaky",
      photo: "ashii3.jpeg",
      songTitle: "🙈",
      song: "getyou.mp3",
      start: 96,
      letter: "Baby,\n\ Mimiss ko man kikiss baby ko i want man frenchie my baby ashii and fuck man hehe"
    },
    {
      label: "Apology",
      photo: "ashii4.jpeg",
      songTitle: "(⁠╯⁠︵⁠╰⁠,⁠)",
      song: "rex.mp3",
      start: 179,
      letter: "My Ashii,\n\ Baby man im sorry marami man ako pag kukulang sayo im sorry man i haven't always lived up to your expectation but i always love you man baby kita"
    },
    {
      label: "Thank You",
      photo: "ashii5.jpeg",
      songTitle: "(⁠/⁠^⁠-⁠^⁠(⁠^-^⁠*⁠)⁠/",
      song: "love.mp3",
      gif: "hug.gif",
      start: 260,
      letter: "Ashi Ko,\n\ Again very thankful man ako i have you, you always make me happy man you always keep up to my drama and always love me, im so beyond grateful my baby i wanna be your husband and love you eternally, you will always my baby ashii ko i don't wish for more you're already more than enough for me man. Happy 7th Monthsarry Po Ashii ko iloveyouusomuch iloveyouumore iloveyouu always iloveyouu baby ashii ko "
    }
  ]
};
/* ============================================================ */

const $ = id => document.getElementById(id);
const heartSVG = '<svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.7-9.6-9.3C.9 7.9 2.7 4.5 6 4.5c2 0 3.4 1.1 4.2 2.4h.1c.8-1.3 2.2-2.4 4.2-2.4 3.3 0 5.1 3.4 3.6 6.7C16 15.8 12 20.5 12 20.5z"/></svg>';
const playIcon = '<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>';
const pauseIcon = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';

$('introTitle').innerHTML = CONFIG.introTitle.split(' ')
  .map((w, i) => `<span class="w" style="--i:${i}">${w}</span>`).join(' ');
$('introLine').textContent = CONFIG.introLine;
document.querySelector('#openBtn').innerHTML = heartSVG;

const audio = $('audio');
const opened = new Set();

// floating hearts
setInterval(() => {
  const h = document.createElement('div');
  h.className = 'float-heart';
  h.innerHTML = heartSVG;
  const size = 14 + Math.random() * 22;
  h.style.cssText = `left:${Math.random() * 100}%;width:${size}px;height:${size}px;animation-duration:${6 + Math.random() * 6}s`;
  h.firstChild.style.cssText = 'width:100%;height:100%;fill:currentColor';
  $('hearts').appendChild(h);
  setTimeout(() => h.remove(), 12500);
}, 900);

function show(id) {
  const cur = document.querySelector('.screen.active');
  const go = () => {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active', 'leaving'));
    $(id).classList.add('active');
    window.scrollTo(0, 0);
  };
  if (cur) { cur.classList.add('leaving'); setTimeout(go, 500); } else go();
}

$('openBtn').onclick = () => show('pick');

// build envelopes
CONFIG.envelopes.forEach((e, i) => {
  const b = document.createElement('button');
  b.className = 'env';
  b.style.setProperty('--i', i);
  b.setAttribute('aria-label', 'Open envelope: ' + e.label);
  b.innerHTML = `<div class="env-body"><div class="mini-seal">${heartSVG}</div></div><span class="label">${e.label}</span>`;
  b.onclick = () => openEnvelope(i, b);
  $('grid').appendChild(b);
});

function setPlayState(playing) { $('playBtn').innerHTML = playing ? pauseIcon : playIcon; }

let busy = false;
function openEnvelope(i, btn) {
  if (busy) return;
  busy = true;
  const e = CONFIG.envelopes[i];
  btn.classList.add('opened', 'lift');
  opened.add(i);

  // photo, with a pretty fallback if the file is missing
  const ph = $('ph');
  ph.innerHTML = '';
  const img = new Image();
  img.alt = e.label;
  img.onload = () => { ph.innerHTML = ''; ph.appendChild(img); };
  img.onerror = () => { ph.innerHTML = `<span>${e.label}</span>`; };
  img.src = e.photo;
  ph.innerHTML = `<span>${e.label}</span>`;

  $('cap').textContent = e.label;
  $('songName').textContent = e.songTitle;
  const box = $('letterText');
  box.innerHTML = '';
  const parts = e.letter.split(/\n\s*\n/);
  parts.forEach((t, k) => {
    const p = document.createElement('p');
    p.textContent = t;
    p.style.setProperty('--i', k);
    box.appendChild(p);
  });
  $('sig').textContent = CONFIG.signature;
  const gif = $('letterGif');
if (e.gif) { gif.src = e.gif; gif.style.display = 'block'; } else { gif.style.display = 'none'; }
  $('sig').style.setProperty('--sd', (1.3 + parts.length * 0.5 + 0.2) + 's');

  audio.src = e.song;
  const startAt = e.start || 0;
  audio.muted = true;
  audio.play().catch(() => {});

  setTimeout(() => {
    $('modal').classList.add('open');
    $('modal').scrollTop = 0;
    document.body.style.overflow = 'hidden';

    setTimeout(() => {
      audio.currentTime = startAt;
      audio.muted = false;
      audio.volume = 0;
      setPlayState(true);
      let v = 0;
      const fade = setInterval(() => {
        v = Math.min(1, v + 0.05);
        audio.volume = v;
        if (v >= 1) clearInterval(fade);
      }, 100);
    }, 1000);

    busy = false;
  }, 800);
}

$('playBtn').onclick = () => {
  if (audio.paused) { audio.play(); setPlayState(true); } else { audio.pause(); setPlayState(false); }
};
audio.onended = () => setPlayState(false);

function closeModal() {
  audio.pause();
  $('modal').classList.remove('open');
  document.body.style.overflow = '';
  setTimeout(() => document.querySelectorAll('.env.lift').forEach(el => el.classList.remove('lift')), 300);
  if (opened.size === CONFIG.envelopes.length) {
    $('finale').textContent = CONFIG.finale;
    setTimeout(() => $('finale').classList.add('show'), 900);
  }
}
$('closeBtn').onclick = closeModal;
setPlayState(false);
</script>
</body>
</html>
